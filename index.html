<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>世界時刻・天気アプリ</title>


<style>

/* =========================================================
   基本
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    padding: 20px;

    font-family:
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

    background: #75faa8;
    color: #222;
}


/* =========================================================
   都市一覧
   ========================================================= */

#cityContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}


/* =========================================================
   都市カード
   ========================================================= */

.city {
    position: relative;

    flex: 0 0 260px;
    width: 260px;
    min-height: 300px;

    padding: 18px;

    border-radius: 18px;

    background-color: white;
    background-size: cover;
    background-position: center;

    color: white;

    text-shadow:
        1px 1px 3px #000,
        -1px -1px 3px #000;

    cursor: pointer;
    overflow: hidden;

    transition: transform 0.2s ease;
}

.city:hover {
    transform: scale(1.03);
}

.city h2 {
    margin: 0 0 20px 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    font-size: 24px;

    white-space: nowrap;
}

.city h2.long-name {
    font-size: 19px;
}

.city-flag {
    display: inline-flex;
    align-items: center;
}

.city-flag img {
    display: block;

    width: 42px;
    height: auto;
}

.city-name {
    display: inline-block;
}

.city-icon {
    display: inline-block;
}

.city p {
    margin: 12px 0;

    text-align: center;
    font-size: 18px;
}

.info-time {
    font-size: 25px !important;
    font-weight: bold;
}

.info-data {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.info-sun {
    font-size: 16px !important;
}

.info-climate {
    font-size: 15px !important;
}

.small-climate {
    font-size: inherit;
}


/* =========================================================
   詳細オーバーレイ
   ========================================================= */

#detailOverlay {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.65);

    z-index: 9999;
}


/* =========================================================
   詳細カード
   ========================================================= */

#detailCard {
    position: relative;

    width: min(1000px, 90vw);
    height: min(800px, 90vh);

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.5);

    cursor: grab;
}


/* =========================================================
   詳細タイトル
   ========================================================= */

#detailTitle {
    position: absolute;

    top: 15px;
    left: 20px;
    right: 20px;

    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    color: white;

    font-size: 30px;
    font-weight: bold;

    text-shadow:
        2px 2px 5px #000;

    pointer-events: none;
}

.detail-flag img {
    display: block;

    width: 70px;
    height: auto;
}

.detail-country-code {
    font-size: 20px;
}


/* =========================================================
   詳細写真エリア
   写真だけを動かす
   ========================================================= */

#detailPhotoLayer {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    z-index: 1;

    touch-action: pan-x;
}

#detailPhoto {
    position: absolute;

    left: 50%;
    top: 50%;

    width: auto;
    height: 100%;

    max-width: none;

    transform:
        translateX(-50%)
        translateY(-50%);

    user-select: none;
    -webkit-user-drag: none;

    pointer-events: none;
}


/* =========================================================
   詳細情報
   ========================================================= */

#detailInfo {
    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 80px;

    z-index: 15;

    padding: 15px;

    border-radius: 15px;

    background: rgba(0, 0, 0, 0.45);

    color: white;

    text-align: center;

    text-shadow:
        1px 1px 3px #000;

    pointer-events: none;
}

#detailInfo p {
    margin: 7px 0;
    font-size: 18px;
}


/* =========================================================
   閉じるボタン
   ========================================================= */

#detailClose {
    position: absolute;

    top: 12px;
    right: 15px;

    z-index: 30;

    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.65);

    color: white;

    font-size: 28px;

    cursor: pointer;
}


/* =========================================================
   前へ・次へ
   ========================================================= */

#detailPrev,
#detailNext {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    z-index: 30;

    width: 55px;
    height: 70px;

    border: none;
    border-radius: 12px;

    background: rgba(0, 0, 0, 0.55);

    color: white;

    font-size: 35px;

    cursor: pointer;
}

#detailPrev {
    left: 15px;
}

#detailNext {
    right: 15px;
}


/* =========================================================
   PC
   ========================================================= */

@media (min-width: 801px) {

    #detailCard {
        cursor: grab;
    }

}


/* =========================================================
   スマホ
   ========================================================= */

@media (max-width: 800px) {

    body {
        padding: 10px;
    }

    #cityContainer {
        flex-direction: column;
        align-items: center;
    }

    .city {
        width: 100%;
        max-width: 420px;
        flex: none;
    }

    /* 詳細カード */
    #detailCard {
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);

        overflow: hidden;

        cursor: default;
    }

    /* 写真だけ左右に動かす */
    #detailPhotoLayer {
        touch-action: pan-x;
    }

    /* タイトル固定 */
    #detailTitle {
        left: 10px;
        right: 10px;

        font-size: 24px;
        gap: 6px;
    }

    .detail-flag img {
        width: 50px;
    }

    .detail-country-code {
        font-size: 16px;
    }

    /* 詳細情報固定 */
    #detailInfo {
        left: 10px;
        right: 10px;

        bottom: 70px;

        padding: 10px;
    }

    #detailInfo p {
        margin: 5px 0;
        font-size: 15px;
    }

    /* 前へ・次へ */
    #detailPrev,
    #detailNext {
        width: 45px;
        height: 60px;

        font-size: 30px;
    }

    /* 閉じる */
    #detailClose {
        width: 40px;
        height: 40px;

        font-size: 24px;
    }
}


/* =========================================================
   大画面
   ========================================================= */

@media (min-width: 2920px) {

    .city {
        flex: 0 0 220px;

        min-height: 220px;

        padding: 12px;
    }

        font-size: 20px;
        margin-bottom: 10px;
    }

    .city p {
        font-size: 14px;
        margin: 6px 0;
    }

    .info-time {
        font-size: 20px !important;
    }

    .info-climate {
        font-size: 12px !important;
    }
}

</style>

/* =========================================================
   ④ 白夜・極夜
   ========================================================= */

function getSunDeclination(date) {

    const start = new Date(
        Date.UTC(
            date.getUTCFullYear(),
            0,
            1
        )
    );

    const diff =
        (date - start) / 86400000;

    const gamma =
        (2 * Math.PI / 365) *
        (diff + 0.5);

    const declination =
        0.006918
        - 0.399912 * Math.cos(gamma)
        + 0.070257 * Math.sin(gamma)
        - 0.006758 * Math.cos(2 * gamma)
        + 0.000907 * Math.sin(2 * gamma)
        - 0.002697 * Math.cos(3 * gamma)
        + 0.001480 * Math.sin(3 * gamma);

    return declination * 180 / Math.PI;
}


function getPolarDayNight(latitude, date) {

    const declination =
        getSunDeclination(date);

    const lat =
        Math.abs(latitude);

    const dec =
        Math.abs(declination);

    if (lat + dec >= 90) {

        if (
            (latitude > 0 && declination > 0) ||
            (latitude < 0 && declination < 0)
        ) {
            return "polarDay";
        }

        return "polarNight";
    }

    return "normal";
}


/* =========================================================
   ⑤ 天気表示
   ========================================================= */

function weatherText(code, isDay) {

    if (code === 0) {
        return isDay
            ? "🌞 晴れ"
            : "🌙 晴れ";
    }

    if (code === 1 || code === 2) {
        return isDay
            ? "🌤️ 晴れ時々曇り"
            : "☁️ 晴れ時々曇り";
    }

    if (code === 3) {
        return "☁️ 曇り";
    }

    if (code >= 51 && code <= 67) {
        return "🌧️ 雨";
    }

    if (code >= 71 && code <= 77) {
        return "❄️ 雪";
    }

    if (code >= 80 && code <= 82) {
        return "🌦️ にわか雨";
    }

    if (code === 45 || code === 48) {
        return "🌫️ 霧";
    }

    if (code === 95) {
        return "⛈️ 雷雨";
    }

    if (code === 96 || code === 99) {
        return "⛈️ 激しい雷雨";
    }

    return "🌍 不明";
}

/* =========================================================
   ⑨ 時刻
   ========================================================= */

function getCityTime(city) {

    try {

        return new Date().toLocaleTimeString(
            "ja-JP",
            {
                timeZone: city.timezone,
                hour12: false,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    } catch (error) {

        console.error(
            "時刻取得エラー:",
            city.name,
            error
        );

        return "--:--:--";
    }
}


function updateTime() {

    const smallMode =
        window.matchMedia(
            "(min-width:2920px)"
        ).matches;

    cities.forEach(city => {

        const fullTime =
            getCityTime(city);

        const timeElement =
            document.getElementById(
                city.id + "Time"
            );

        if (timeElement) {

            timeElement.dataset.fullTime =
                fullTime;

            timeElement.textContent =
                smallMode
                    ? fullTime.substring(0, 5)
                    : fullTime;
        }

        if (
            detailCityId === city.id &&
            detailOverlay.style.display === "flex"
        ) {

            detailTime.textContent =
                "🕒 " + fullTime;
        }
    });
}


/* =========================================================
   ⑩ 天気取得
   ========================================================= */

async function getWeather() {

    for (const city of cities) {

        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${city.latitude}` +
            `&longitude=${city.longitude}` +
            `&current=temperature_2m,relative_humidity_2m,weather_code,is_day` +
            `&daily=sunrise,sunset` +
            `&timezone=auto`;

        try {

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const data =
                await response.json();

            updateCityWeather(
                city,
                data
            );

        } catch (error) {

            console.error(
                "天気取得エラー:",
                city.name,
                error
            );

            const weatherElement =
                document.getElementById(
                    city.id + "Weather"
                );

            if (weatherElement) {
                weatherElement.textContent =
                    "取得失敗";
            }
        }
    }

    updateTemperatureDisplay();

    if (detailCityId) {

        const city =
            cities.find(
                c => c.id === detailCityId
            );

        if (city) {
            updateDetailFromCity(city);
        }
    }
}


/* =========================================================
   ⑪ 都市ごとの天気表示
   ========================================================= */

function updateCityWeather(city, data) {

    const card =
        document.getElementById(
            city.id + "Card"
        );

    /* -----------------------------------------------------
       昼・夜写真
       ----------------------------------------------------- */

    if (card && city.image) {

        let image =
            city.image;

        if (
            city.nightImage &&
            data.current &&
            data.current.is_day === 0
        ) {

            image =
                city.nightImage;
        }

        card.style.backgroundImage =
            `
            linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ),
            url("${image}")
            `;

        card.dataset.photo =
            image;
    }


    /* -----------------------------------------------------
       温度
       ----------------------------------------------------- */

    if (data.current) {

        const temp =
            data.current.temperature_2m;

        const tempElement =
            document.getElementById(
                city.id + "Temp"
            );

        if (tempElement) {

            tempElement.dataset.temperature =
                temp;
        }
    }


    /* -----------------------------------------------------
       湿度
       ----------------------------------------------------- */

    const humidityElement =
        document.getElementById(
            city.id + "Humidity"
        );

    if (
        humidityElement &&
        data.current
    ) {

        humidityElement.textContent =
            data.current.relative_humidity_2m;
    }


    /* -----------------------------------------------------
       天気
       ----------------------------------------------------- */

    const weatherElement =
        document.getElementById(
            city.id + "Weather"
        );

    if (
        weatherElement &&
        data.current
    ) {

        weatherElement.textContent =
            weatherText(
                data.current.weather_code,
                data.current.is_day === 1
            );
    }


    /* -----------------------------------------------------
       日の出・日の入り
       ----------------------------------------------------- */

    let sunriseText = "--:--";
    let sunsetText = "--:--";

    const polarStatus =
        getPolarDayNight(
            city.latitude,
            new Date()
        );

    if (polarStatus === "polarDay") {

        sunriseText = "00:00";
        sunsetText = "00:00";

    } else if (
        polarStatus === "normal" &&
        data.daily &&
        data.daily.sunrise &&
        data.daily.sunset &&
        data.daily.sunrise[0] &&
        data.daily.sunset[0]
    ) {

        sunriseText =
            data.daily.sunrise[0]
                .split("T")[1]
                .substring(0, 5);

        sunsetText =
            data.daily.sunset[0]
                .split("T")[1]
                .substring(0, 5);
    }


    const sunriseElement =
        document.getElementById(
            city.id + "Sunrise"
        );

    const sunsetElement =
        document.getElementById(
            city.id + "Sunset"
        );

    if (sunriseElement) {
        sunriseElement.textContent =
            sunriseText;
    }

    if (sunsetElement) {
        sunsetElement.textContent =
            sunsetText;
    }
}


/* =========================================================
   ⑫ 温度表示
   ========================================================= */

function updateTemperatureDisplay() {

    const smallMode =
        window.matchMedia(
            "(min-width:2920px)"
        ).matches;

    document
        .querySelectorAll(".city")
        .forEach(card => {

            const tempElement =
                card.querySelector(
                    "[id$='Temp']"
                );

            if (!tempElement) {
                return;
            }

            const temp =
                Number(
                    tempElement.dataset.temperature
                );

            if (isNaN(temp)) {

                tempElement.textContent =
                    "--";

            } else {

                tempElement.textContent =
                    smallMode
                        ? Math.round(temp)
                        : temp;
            }


            const climateElement =
                card.querySelector(
                    ".info-climate"
                );

            if (!climateElement) {
                return;
            }

            const climateCode =
                climateElement.textContent
                    .replace("🌍", "")
                    .trim()
                    .split("（")[0];


            let smallClimate =
                card.querySelector(
                    ".small-climate"
                );


            if (smallMode) {

                if (!smallClimate) {

                    smallClimate =
                        document.createElement(
                            "span"
                        );

                    smallClimate.className =
                        "small-climate";

                    smallClimate.style.marginLeft =
                        "8px";

                    tempElement
                        .parentElement
                        .appendChild(
                            smallClimate
                        );
                }

                smallClimate.textContent =
                    climateCode;

            } else {

                if (smallClimate) {
                    smallClimate.remove();
                }
            }
        });
}


/* =========================================================
   ⑬ 詳細カード用座標
   ========================================================= */

function getCoordinateText(city) {

    const latitudeText =
        city.latitude >= 0
            ? "北緯 " +
              Math.abs(
                  city.latitude
              ).toFixed(2) +
              "°"
            : "南緯 " +
              Math.abs(
                  city.latitude
              ).toFixed(2) +
              "°";

    const longitudeText =
        city.longitude >= 0
            ? "東経 " +
              Math.abs(
                  city.longitude
              ).toFixed(2) +
              "°"
            : "西経 " +
              Math.abs(
                  city.longitude
              ).toFixed(2) +
              "°";

    return (
        "📍 " +
        latitudeText +
        "・" +
        longitudeText
    );
}

    detailCityId =
        city.id;


    /* 写真位置をリセット */

    resetDetailPhotoPosition();


    /* -----------------------------------------------------
       タイトル
       ----------------------------------------------------- */

    const flagImage =
        getFlagImage(
            city.flagCode
        );

    detailTitle.innerHTML = `

        <span class="detail-flag">

            <img
                src="${flagImage}"
                width="70"
                alt="${city.name}の国旗"
            >

        </span>

        <span class="detail-country-code">

            ${
                city.flagCode
                    ? city.flagCode.toUpperCase()
                    : ""
            }

        </span>

        <span class="city-name">

            ${city.name}

        </span>

        <span class="city-icon">

            ${city.icon || ""}

        </span>

    `;


    /* -----------------------------------------------------
       詳細情報
       ----------------------------------------------------- */

    updateDetailFromCity(city);


    /* -----------------------------------------------------
       詳細写真
       ----------------------------------------------------- */

    let detailImage =
        city.image || "";

    const cityCard =
        document.getElementById(
            city.id + "Card"
        );

    if (cityCard) {

        const currentPhoto =
            cityCard.dataset.photo;

        if (currentPhoto) {
            detailImage =
                currentPhoto;
        }
    }


    detailPhoto.onload = null;

    detailPhoto.src =
        detailImage;

    detailPhoto.alt =
        city.name +
        "の写真";


    detailPhoto.onload =
        () => {

            resetDetailPhotoPosition();

        };


    /* -----------------------------------------------------
       表示
       ----------------------------------------------------- */

    detailOverlay.style.display =
        "flex";
}


/* =========================================================
   ⑯ 都市カードクリック
   ========================================================= */

cityContainer.addEventListener(
    "click",
    event => {

        const card =
            event.target.closest(".city");

        if (!card) {
            return;
        }

        const cityId =
            card.id.replace(
                "Card",
                ""
            );

        const city =
            cities.find(
                c => c.id === cityId
            );

        if (!city) {
            return;
        }

        showDetailCity(city);
    }
);


/* =========================================================
   ⑰ 前へ
   ========================================================= */

detailPrev.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        if (!detailCityId) {
            return;
        }

        const currentIndex =
            cities.findIndex(
                city =>
                    city.id ===
                    detailCityId
            );

        if (currentIndex === -1) {
            return;
        }

        const previousIndex =
            (
                currentIndex -
                1 +
                cities.length
            ) %
            cities.length;

        showDetailCity(
            cities[previousIndex]
        );
    }
);


/* =========================================================
   ⑱ 次へ
   ========================================================= */

detailNext.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        if (!detailCityId) {
            return;
        }

        const currentIndex =
            cities.findIndex(
                city =>
                    city.id ===
                    detailCityId
            );

        if (currentIndex === -1) {
            return;
        }

        const nextIndex =
            (
                currentIndex +
                1
            ) %
            cities.length;

        showDetailCity(
            cities[nextIndex]
        );
    }
);


/* =========================================================
   ⑲ 詳細カードを閉じる
   ========================================================= */

function closeDetail() {

    detailOverlay.style.display =
        "none";

    detailCityId =
        null;

    resetDetailPhotoPosition();
}


detailClose.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        closeDetail();
    }
);


/* =========================================================
   ⑳ 背景クリックで閉じる
   ========================================================= */

detailOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            detailOverlay
        ) {

            closeDetail();
        }
    }
);


/* =========================================================
   ㉑ PC版カードドラッグ
   ========================================================= */

let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;


detailCard.addEventListener(
    "mousedown",
    event => {

        if (
            window.matchMedia(
                "(max-width:800px)"
            ).matches
        ) {
            return;
        }

        if (
            event.target === detailClose ||
            event.target === detailPrev ||
            event.target === detailNext
        ) {
            return;
        }

        isDragging = true;

        const rect =
            detailCard.getBoundingClientRect();

        dragOffsetX =
            event.clientX -
            rect.left;

        dragOffsetY =
            event.clientY -
            rect.top;

        detailCard.style.cursor =
            "grabbing";

        event.preventDefault();
    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (!isDragging) {
            return;
        }

        let left =
            event.clientX -
            dragOffsetX;

        let top =
            event.clientY -
            dragOffsetY;

        const maxLeft =
            Math.max(
                0,
                window.innerWidth -
                detailCard.offsetWidth
            );

        const maxTop =
            Math.max(
                0,
                window.innerHeight -
                detailCard.offsetHeight
            );

        left =
            Math.max(
                0,
                Math.min(
                    left,
                    maxLeft
                )
            );

        top =
            Math.max(
                0,
                Math.min(
                    top,
                    maxTop
                )
            );

        detailCard.style.left =
            left + "px";

        detailCard.style.top =
            top + "px";
    }
);


document.addEventListener(
    "mouseup",
    () => {

        if (!isDragging) {
            return;
        }

        isDragging = false;

        detailCard.style.cursor =
            "grab";
    }
);


/* =========================================================
   ㉒ スマホ版
   写真だけ左右スワイプ
   ★ここは1セットだけ
   ========================================================= */

detailPhotoLayer.addEventListener(
    "touchstart",
    event => {

        if (window.innerWidth > 800) {
            return;
        }

        if (
            !event.touches ||
            event.touches.length !== 1
        ) {
            return;
        }

        if (!detailPhoto) {
            return;
        }

        photoSwipeStartX =
            event.touches[0].clientX;

        photoSwipeStartPosition =
            photoSwipeCurrentX;

        photoIsDragging = true;
    },
    {
        passive: true
    }
);


detailPhotoLayer.addEventListener(
    "touchmove",
    event => {

        if (!photoIsDragging) {
            return;
        }

        if (
            !event.touches ||
            event.touches.length !== 1
        ) {
            return;
        }

        const currentX =
            event.touches[0].clientX;

        const movement =
            currentX -
            photoSwipeStartX;

        let newPosition =
            photoSwipeStartPosition +
            movement;


        /* 写真の実際の横幅 */

        const photoWidth =
            detailPhoto.offsetWidth;


        /* 写真表示エリアの横幅 */

        const areaWidth =
            detailPhotoLayer.clientWidth;


        /* 左右に動かせる最大量 */

        const maxMove =
            Math.max(
                0,
                (
                    photoWidth -
                    areaWidth
                ) / 2
            );


        /* 移動範囲制限 */

        newPosition =
            Math.max(
                -maxMove,
                Math.min(
                    maxMove,
                    newPosition
                )
            );


        photoSwipeCurrentX =
            newPosition;


        /* 写真だけ移動 */

        setDetailPhotoPosition(
            photoSwipeCurrentX
        );


        /* ページ全体を動かさない */

        event.preventDefault();
    },
    {
        passive: false
    }
);


detailPhotoLayer.addEventListener(
    "touchend",
    () => {

        photoIsDragging =
            false;
    },
    {
        passive: true
    }
);


detailPhotoLayer.addEventListener(
    "touchcancel",
    () => {

        photoIsDragging =
            false;
    },
    {
        passive: true
    }
);


/* =========================================================
   ㉓ リサイズ
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        updateTemperatureDisplay();

        if (
            detailPhoto &&
            detailPhoto.complete
        ) {

            setDetailPhotoPosition(
                photoSwipeCurrentX
            );
        }
    }
);


/* =========================================================
   ㉔ 起動
   ========================================================= */

updateTime();

setInterval(
    updateTime,
    1000
);

updateTemperatureDisplay();

getWeather();


window.addEventListener(
    "load",
    () => {

        updateTemperatureDisplay();

    }
);

</script>


</body>
