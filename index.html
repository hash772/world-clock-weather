/* =========================================================
   基本
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: sans-serif;
    text-align: center;
    background-color: #75faa8;
    overflow-x: hidden;
}

h1 {
    margin: 20px 10px;
}


/* =========================================================
   都市カード
   ========================================================= */

.container {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    padding: 10px 15px 30px;
}

.city {
    flex: 0 0 260px;
    width: 260px;
    height: 260px;

    padding: 15px;

    border: 2px solid #4a90e2;
    border-radius: 15px;

    color: white;
    text-shadow: 3px 3px 8px black;

    cursor: pointer;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transition: 0.3s;

    overflow: hidden;

    visibility: visible;
    opacity: 1;
}

.city:hover {
    transform: scale(1.03);
}


/* =========================================================
   都市名
   ========================================================= */

.city h2 {
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 15px;
    margin-bottom: 20px;

    white-space: nowrap;
}

.city-flag {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
}

.city-flag img {
    width: 42px;
    height: auto;
    display: block;
}

.city-name {
    white-space: nowrap;
}

.city-icon {
    display: inline-block;
    flex-shrink: 0;
}

.city h2.long-name {
    font-size: inherit;
    transform: none;
}

.city .info-climate {
    white-space: nowrap;
}


/* =========================================================
   温度・湿度
   ========================================================= */

.city .info-data {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 18px;

    margin: 15px auto;

    padding: 0;

    white-space: nowrap;
}

.city p {
    margin: 10px 0;
    line-height: 1.2;
}

.weather-line {
    white-space: nowrap;
}

.city .info-time {
    margin-top: 15px;
    margin-bottom: 15px;
}


/* =========================================================
   通常カードの日の出・日の入り
   ========================================================= */

.city .info-sun {
    display: none !important;
}


/* =========================================================
   2920px以上
   超縮小表示
   ========================================================= */

    .city-flag {
        display: none;
    }

    .city-icon {
        display: none;
    }

    .humidity {
        display: none;
    }

    .info-climate {
        display: none;
    }

    .info-sun {

<body>

/* =========================================================
   ② 国旗
   ========================================================= */

function getFlagImage(flagCode) {

    if (!flagCode) {
        return "";
    }

    return `https://flagcdn.com/w40/${flagCode}.png`;
}


/* =========================================================
   ③ 白夜・極夜
   ========================================================= */

function getSunDeclination(date) {

    const start = new Date(
        Date.UTC(
            date.getUTCFullYear(),
            0,
            1
        )
    );

    const diff =
        (date - start) / 86400000;

    const gamma =
        (2 * Math.PI / 365) *
        (diff + 0.5);

    const declination =
        0.006918
        - 0.399912 * Math.cos(gamma)
        + 0.070257 * Math.sin(gamma)
        - 0.006758 * Math.cos(2 * gamma)
        + 0.000907 * Math.sin(2 * gamma)
        - 0.002697 * Math.cos(3 * gamma)
        + 0.001480 * Math.sin(3 * gamma);

    return declination * 180 / Math.PI;
}


function getPolarDayNight(latitude, date) {

    const declination =
        getSunDeclination(date);

    const lat =
        Math.abs(latitude);

    const dec =
        Math.abs(declination);

    if (lat + dec >= 90) {

        if (
            (latitude > 0 && declination > 0) ||
            (latitude < 0 && declination < 0)
        ) {
            return "polarDay";
        }

        return "polarNight";
    }

    return "normal";
}


/* =========================================================
   ④ 天気
   ========================================================= */

function weatherText(code, isDay) {

    if (code === 0) {
        return isDay ? "🌞 晴れ" : "🌙 晴れ";
    }

    if (code === 1 || code === 2) {
        return isDay
            ? "🌤️ 晴れ時々曇り"
            : "☁️ 晴れ時々曇り";
    }

    if (code === 3) {
        return "☁️ 曇り";
    }

    if (code >= 51 && code <= 67) {
        return "🌧️ 雨";
    }

    if (code >= 71 && code <= 77) {
        return "❄️ 雪";
    }

    if (code >= 80 && code <= 82) {
        return "🌦️ にわか雨";
    }

    if (code === 45 || code === 48) {
        return "🌫️ 霧";
    }

    if (code === 95) {
        return "⛈️ 雷雨";
    }

    if (code === 96 || code === 99) {
        return "⛈️ 激しい雷雨";
    }

    return "🌍 不明";
}

/* =========================================================
   ⑥ 詳細カードDOM
   ========================================================= */

const detailOverlay =
    document.getElementById("detailOverlay");

const detailCard =
    document.getElementById("detailCard");

const detailTitle =
    document.getElementById("detailTitle");

const detailTime =
    document.getElementById("detailTime");

const detailWeather =
    document.getElementById("detailWeather");

const detailTemp =
    document.getElementById("detailTemp");

const detailHumidity =
    document.getElementById("detailHumidity");

const detailSunrise =
    document.getElementById("detailSunrise");

const detailSunset =
    document.getElementById("detailSunset");

const detailCoordinates =
    document.getElementById("detailCoordinates");

const detailClimate =
    document.getElementById("detailClimate");

const detailClose =
    document.getElementById("detailClose");

const detailPrev =
    document.getElementById("detailPrev");

const detailNext =
    document.getElementById("detailNext");


let detailCityId = null;


/* =========================================================
   ⑦ 時刻更新
   ★1つだけ
   ========================================================= */

function updateTime() {

    const now =
        new Date();

    const smallMode =
        window.matchMedia(
            "(min-width:2920px)"
        ).matches;


    cities.forEach(city => {

        let fullTime = "--:--:--";


        try {

            fullTime =
                now.toLocaleTimeString(
                    "ja-JP",
                    {
                        timeZone: city.timezone,
                        hour12: false,
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );

        }

        catch (error) {

            console.error(
                "時刻取得エラー:",
                city.name,
                error
            );

        }


        const timeElement =
            document.getElementById(
                city.id + "Time"
            );


        if (timeElement) {

            timeElement.dataset.fullTime =
                fullTime;

            timeElement.textContent =
                smallMode
                    ? fullTime.substring(0,5)
                    : fullTime;

        }


        if (
            detailCityId === city.id &&
            detailOverlay.style.display === "flex"
        ) {

            detailTime.textContent =
                "🕒 " + fullTime;

        }

    });

}


updateTime();

setInterval(
    updateTime,
    1000
);


/* =========================================================
   ⑧ 天気取得
   ========================================================= */

async function getWeather() {

    for (const city of cities) {

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${city.latitude}&longitude=${city.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,is_day&daily=sunrise,sunset&timezone=auto`;

        try {

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }


            const data =
                await response.json();


            /* =========================
               背景
               ========================= */

            const card =
                document.getElementById(
                    city.id + "Card"
                );


            if (card && city.image) {

                let image =
                    city.image;

                let dark =
                    "rgba(0,0,0,0.45)";


                if (
                    city.nightImage &&
                    data.current &&
                    data.current.is_day === 0
                ) {

                    image =
                        city.nightImage;

                    dark =
                        "rgba(0,0,0,0.25)";

                }


                card.style.backgroundImage =
                    `
                    linear-gradient(
                        ${dark},
                        ${dark}
                    ),
                    url("${image}")
                    `;

            }


            /* =========================
               温度
               ========================= */

            if (data.current) {

                const temp =
                    data.current.temperature_2m;


                const tempElement =
                    document.getElementById(
                        city.id + "Temp"
                    );


                if (tempElement) {

                    tempElement.dataset.temperature =
                        temp;

                    tempElement.textContent =
                        window.matchMedia(
                            "(min-width:2920px)"
                        ).matches
                            ? Math.round(temp)
                            : temp;

                }

            }


            /* =========================
               湿度
               ========================= */

            const humidityElement =
                document.getElementById(
                    city.id + "Humidity"
                );


            if (
                humidityElement &&
                data.current
            ) {

                humidityElement.textContent =
                    data.current.relative_humidity_2m;

            }


            /* =========================
               天気
               ========================= */

            const weatherElement =
                document.getElementById(
                    city.id + "Weather"
                );


            if (
                weatherElement &&
                data.current
            ) {

                weatherElement.textContent =
                    weatherText(
                        data.current.weather_code,
                        data.current.is_day === 1
                    );

            }


            /* =========================
               日の出・日の入り
               ========================= */

            const today =
                new Date();


            const polarStatus =
                getPolarDayNight(
                    city.latitude,
                    today
                );


            let sunriseText =
                "--:--";

            let sunsetText =
                "--:--";


            if (
                polarStatus === "polarDay"
            ) {

                sunriseText =
                    "00:00";

                sunsetText =
                    "00:00";

            }

            else if (
                polarStatus === "normal" &&
                data.daily &&
                data.daily.sunrise &&
                data.daily.sunset &&
                data.daily.sunrise[0] &&
                data.daily.sunset[0]
            ) {

                sunriseText =
                    data.daily.sunrise[0]
                        .split("T")[1]
                        .substring(0,5);

                sunsetText =
                    data.daily.sunset[0]
                        .split("T")[1]
                        .substring(0,5);

            }


            const sunriseElement =
                document.getElementById(
                    city.id + "Sunrise"
                );

            const sunsetElement =
                document.getElementById(
                    city.id + "Sunset"
                );


            if (sunriseElement) {

                sunriseElement.textContent =
                    sunriseText;

            }


            if (sunsetElement) {

                sunsetElement.textContent =
                    sunsetText;

            }

        }

        catch (error) {

            console.error(
                "天気取得エラー:",
                city.name,
                error
            );


            const weatherElement =
                document.getElementById(
                    city.id + "Weather"
                );


            if (weatherElement) {

                weatherElement.textContent =
                    "取得失敗";

            }

        }

    }

}


/* =========================================================
   ⑨ 温度表示
   ========================================================= */

function updateTemperatureDisplay() {

    const smallMode =
        window.matchMedia(
            "(min-width:2920px)"
        ).matches;


    document
        .querySelectorAll(".city")
        .forEach(card => {

            const tempElement =
                card.querySelector(
                    "[id$='Temp']"
                );


            if (!tempElement) {
                return;
            }


            const temp =
                Number(
                    tempElement.dataset.temperature
                );


            if (isNaN(temp)) {

                tempElement.textContent =
                    "--";

            }

            else {

                tempElement.textContent =
                    smallMode
                        ? Math.round(temp)
                        : temp;

            }


            const climateElement =
                card.querySelector(
                    ".info-climate"
                );


            if (!climateElement) {
                return;
            }


            const climateCode =
                climateElement.textContent
                    .replace("🌍", "")
                    .trim()
                    .split("（")[0];


            let smallClimate =
                card.querySelector(
                    ".small-climate"
                );


            if (smallMode) {

                if (!smallClimate) {

                    smallClimate =
                        document.createElement(
                            "span"
                        );

                    smallClimate.className =
                        "small-climate";

                    smallClimate.style.marginLeft =
                        "8px";

                    tempElement.parentElement
                        .appendChild(
                            smallClimate
                        );

                }


                smallClimate.textContent =
                    climateCode;

            }

            else {

                if (smallClimate) {
                    smallClimate.remove();
                }

            }

        });

}


window.addEventListener(
    "resize",
    updateTemperatureDisplay
);


/* =========================================================
   ⑩ 詳細カード
   ★1つだけ
   ========================================================= */

function showDetailCity(city) {

    if (!city) {
        return;
    }


    detailCityId =
        city.id;


    const card =
        document.getElementById(
            city.id + "Card"
        );


    /* =========================
       タイトル
       ========================= */

    const flagImage =
        getFlagImage(
            city.flagCode
        );


    detailTitle.innerHTML =
    `
        <span class="detail-flag">

            <img
                src="${flagImage}"
                width="70"
                alt="${city.name}の国旗"
            >

        </span>

        <span class="detail-country-code">
            ${city.flagCode
                ? city.flagCode.toUpperCase()
                : ""}
        </span>

        <span class="city-name">
            ${city.name}
        </span>

        <span class="city-icon">
            ${city.icon || ""}
        </span>
    `;


    /* =========================
       時刻
       ========================= */

    const now =
        new Date();


    let currentTime =
        "--:--:--";


    try {

        currentTime =
            now.toLocaleTimeString(
                "ja-JP",
                {
                    timeZone: city.timezone,
                    hour12: false,
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

    }

    catch (error) {

        console.error(
            "詳細時刻エラー:",
            city.name,
            error
        );

    }


    detailTime.textContent =
        "🕒 " + currentTime;


    /* =========================
       天気
       ========================= */

    const weatherElement =
        document.getElementById(
            city.id + "Weather"
        );


    detailWeather.textContent =
        weatherElement
            ? weatherElement.textContent
            : "--";


    /* =========================
       気温
       ========================= */

    const tempElement =
        document.getElementById(
            city.id + "Temp"
        );


    detailTemp.textContent =
        "🌡 " +
        (
            tempElement
                ? tempElement.textContent
                : "--"
        ) +
        "℃";


    /* =========================
       湿度
       ========================= */

    const humidityElement =
        document.getElementById(
            city.id + "Humidity"
        );


    detailHumidity.textContent =
        "💧 " +
        (
            humidityElement
                ? humidityElement.textContent
                : "--"
        ) +
        "%";


    /* =========================
       日の出
       ========================= */

    const sunriseElement =
        document.getElementById(
            city.id + "Sunrise"
        );


    detailSunrise.textContent =
        "🌅 " +
        (
            sunriseElement
                ? sunriseElement.textContent
                : "--:--"
        );


    /* =========================
       日の入り
       ========================= */

    const sunsetElement =
        document.getElementById(
            city.id + "Sunset"
        );


    detailSunset.textContent =
        "🌇 " +
        (
            sunsetElement
                ? sunsetElement.textContent
                : "--:--"
        );


    /* =========================
       座標
       ========================= */

    const latitudeText =
        city.latitude >= 0
            ? "北緯 " +
              Math.abs(
                  city.latitude
              ).toFixed(2) +
              "°"
            : "南緯 " +
              Math.abs(
                  city.latitude
              ).toFixed(2) +
              "°";


    const longitudeText =
        city.longitude >= 0
            ? "東経 " +
              Math.abs(
                  city.longitude
              ).toFixed(2) +
              "°"
            : "西経 " +
              Math.abs(
                  city.longitude
              ).toFixed(2) +
              "°";


    detailCoordinates.textContent =
        "📍 " +
        latitudeText +
        "・" +
        longitudeText;


    /* =========================
       気候
       ========================= */

    detailClimate.textContent =
        "🌍 " +
        city.climate;


    /* =========================
       背景
       ========================= */

    if (card) {

        detailCard.style.backgroundImage =
            card.style.backgroundImage;

    }


    /* =========================
       表示
       ★スマホでも操作可能
       ========================= */

    detailOverlay.style.display =
        "flex";

    detailOverlay.style.visibility =
        "visible";

    detailOverlay.style.pointerEvents =
        "auto";

}


/* =========================================================
   ⑪ 都市カードクリック
   ========================================================= */

cityContainer.addEventListener(
    "click",
    event => {

        const card =
            event.target.closest(".city");


        if (!card) {
            return;
        }


        const cityId =
            card.id.replace(
                "Card",
                ""
            );


        const city =
            cities.find(
                c => c.id === cityId
            );


        if (!city) {
            return;
        }


        showDetailCity(city);

    }
);


/* =========================================================
   ⑫ 前へ
   ========================================================= */

detailPrev.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        if (!detailCityId) {
            return;
        }


        const currentIndex =
            cities.findIndex(
                city =>
                    city.id === detailCityId
            );


        if (currentIndex === -1) {
            return;
        }


        const previousIndex =
            (
                currentIndex -
                1 +
                cities.length
            ) %
            cities.length;


        showDetailCity(
            cities[previousIndex]
        );

    }
);


/* =========================================================
   ⑬ 次へ
   ========================================================= */

detailNext.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        if (!detailCityId) {
            return;
        }


        const currentIndex =
            cities.findIndex(
                city =>
                    city.id === detailCityId
            );


        if (currentIndex === -1) {
            return;
        }


        const nextIndex =
            (
                currentIndex +
                1
            ) %
            cities.length;


        showDetailCity(
            cities[nextIndex]
        );

    }
);


/* =========================================================
   ⑭ 閉じる
   ========================================================= */

detailClose.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        detailOverlay.style.display =
            "none";

        detailOverlay.style.visibility =
            "hidden";

        detailOverlay.style.pointerEvents =
            "none";


        detailCityId =
            null;

    }
);


/* =========================================================
   ⑮ 背景クリック
   ========================================================= */

detailOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            detailOverlay
        ) {

            detailOverlay.style.display =
                "none";

            detailOverlay.style.visibility =
                "hidden";

            detailOverlay.style.pointerEvents =
                "none";

            detailCityId =
                null;

        }

    }
);


/* =========================================================
   ⑯ ドラッグ
   ========================================================= */

let isDragging =
    false;

let dragOffsetX =
    0;

let dragOffsetY =
    0;


detailCard.addEventListener(
    "mousedown",
    event => {

        if (
            event.target === detailClose ||
            event.target === detailPrev ||
            event.target === detailNext
        ) {
            return;
        }


        isDragging =
            true;


        const rect =
            detailCard.getBoundingClientRect();


        dragOffsetX =
            event.clientX -
            rect.left;


        dragOffsetY =
            event.clientY -
            rect.top;


        detailCard.style.cursor =
            "grabbing";


        event.preventDefault();

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (!isDragging) {
            return;
        }


        let left =
            event.clientX -
            dragOffsetX;


        let top =
            event.clientY -
            dragOffsetY;


        const maxLeft =
            Math.max(
                0,
                window.innerWidth -
                detailCard.offsetWidth
            );


        const maxTop =
            Math.max(
                0,
                window.innerHeight -
                detailCard.offsetHeight
            );


        left =
            Math.max(
                0,
                Math.min(
                    left,
                    maxLeft
                )
            );


        top =
            Math.max(
                0,
                Math.min(
                    top,
                    maxTop
                )
            );


        detailCard.style.left =
            left + "px";

        detailCard.style.top =
            top + "px";

    }
);


document.addEventListener(
    "mouseup",
    () => {

        if (!isDragging) {
            return;
        }


        isDragging =
            false;


        detailCard.style.cursor =
            "grab";

    }
);


/* =========================================================
   ⑰ 起動
   ========================================================= */

updateTemperatureDisplay();

getWeather();


window.addEventListener(
    "load",
    () => {

        setTimeout(
            updateTemperatureDisplay,
            1500
        );

    }
);

</script>
